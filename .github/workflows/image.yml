name: image

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-24.04
    env:
      IMAGE: ghcr.io/ghegar/sacbe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Etiqueta
        id: tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          gs="${tag%-*}"
          grep -q "^ARG GS_VERSION=${gs}$" Dockerfile || { echo "la etiqueta ${tag} no coincide con GS_VERSION"; exit 1; }
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - name: Build local
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          load: true
          tags: sacbe:ci
          build-args: REVISION=${{ github.sha }}
          cache-to: type=gha,mode=max
          cache-from: type=gha

      - name: Smoke test
        run: sh smoke.sh sacbe:ci

      - name: Escaneo
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: sacbe:ci
          severity: CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: '1'

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
          build-args: REVISION=${{ github.sha }}
          cache-from: type=gha
          sbom: true
          provenance: mode=max
